<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veyma VIP Card</title>

<style>
@font-face{
font-family:iransans;
src:local("Arial");
}

*{
box-sizing:border-box;
font-family:iransans,Arial;
}

body{
margin:0;
background:#050505;
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:92%;
max-width:430px;
}

.card{
background:linear-gradient(145deg,#161616,#050505);
border:1px solid #c9a227;
border-radius:30px;
padding:25px;
box-shadow:0 0 35px #000;
text-align:center;
}

.logo{
width:130px;
height:130px;
border-radius:50%;
object-fit:contain;
margin-bottom:15px;
}

.title{
font-size:25px;
color:#d8b44a;
font-weight:bold;
}

.subtitle{
color:#ddd;
margin:10px 0 25px;
}

.box{
background:#111;
border:1px solid #8e6d18;
border-radius:20px;
padding:20px;
margin:15px 0;
text-align:right;
}

.label{
color:#aaa;
font-size:15px;
}

.value{
font-size:24px;
font-weight:bold;
margin-top:10px;
color:#fff;
}


.reward{
background:#00a94f;
border:none;
width:100%;
padding:18px;
border-radius:18px;
font-size:22px;
font-weight:bold;
color:white;
margin-top:10px;
cursor:pointer;
box-shadow:0 5px 20px #003d1c;
}


.contact{
display:block;
background:linear-gradient(90deg,#c9a227,#806000);
color:#000;
text-decoration:none;
padding:16px;
border-radius:18px;
font-weight:bold;
font-size:18px;
margin-top:20px;
}


.footer{
margin-top:20px;
color:#999;
font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<div class="card">

<img src="logo.png" class="logo">

<div class="title">
کارت هدیه مشتریان VIP
</div>

<div class="subtitle">
Veyma Collection
</div>


<div class="box">

<div class="label">
مجموع خرید
</div>

<div class="value">
۵۲,۵۰۰,۰۰۰ تومان
</div>

</div>



<div class="box">

<div class="label">
تعداد خرید
</div>

<div class="value">
۲ بار
</div>

</div>



<div class="box">

<div class="label">
پاداش فعلی شما
</div>

<div class="value">
۳۰۰,۰۰۰ تومان هدیه
</div>

<button class="reward">
مشاهده پاداش VIP
</button>

</div>



<a class="contact" 
href="https://veymacollection.github.io/veyma-collection/"
target="_blank">
راه‌های ارتباطی
</a>


<div class="footer">
کارت اختصاصی مشتریان ویژه ویما
</div>


</div>

</div>


<script>

if(navigator.share){

document.querySelector(".contact").addEventListener("click",function(e){

e.preventDefault();

navigator.share({
title:"Veyma Collection",
text:"راه‌های ارتباطی ویما",
url:"https://veymacollection.github.io/veyma-collection/"
});

});

}

</script>


</body>
</html>
