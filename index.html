<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کارت هدیه مشتریان VIP | Veyma Collection</title>

  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="کارت هدیه مشتریان VIP ویما">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.10), transparent 32%),
        linear-gradient(145deg, #050505, #111111 48%, #070707);
      color: #ffffff;
      font-family: "Vazirmatn", sans-serif;
      padding: 18px 12px 28px;
    }

    .page {
      width: 100%;
      max-width: 470px;
      margin: 0 auto;
      position: relative;
    }

    /* قاب اصلی */

    .vip-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.65);
      border-radius: 30px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.012)
        ),
        #0c0c0c;
      box-shadow:
        0 20px 55px rgba(0,0,0,0.75),
        inset 0 0 35px rgba(212,175,55,0.035);
      padding: 22px 18px 20px;
    }

    .vip-card::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(212,175,55,0.16);
      border-radius: 24px;
      pointer-events: none;
    }

    /* نور طلایی بالای صفحه */

    .gold-glow {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(212,175,55,0.08);
      filter: blur(55px);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* لوگو */

    .logo-box {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 5px 18px rgba(212,175,55,0.18));
    }

    /* جعبه هدیه */

    .gift-decoration {
      position: absolute;
      top: 9px;
      right: 18px;
      width: 38px;
      height: 31px;
      opacity: 0.85;
    }

    .gift-box {
      position: absolute;
      bottom: 0;
      right: 2px;
      width: 29px;
      height: 21px;
      border: 1px solid #d4af37;
      border-radius: 2px;
      background: linear-gradient(135deg, #151515, #292929);
    }

    .gift-box::before {
      content: "";
      position: absolute;
      top: -5px;
      right: -2px;
      width: 33px;
      height: 5px;
      border: 1px solid #d4af37;
      background: #171717;
      border-radius: 2px;
    }

    .gift-ribbon-v {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 13px;
      width: 4px;
      background: #b89425;
    }

    .gift-ribbon-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 7px;
      height: 3px;
      background: #b89425;
    }

    .gift-bow {
      position: absolute;
      top: -8px;
      right: 9px;
      width: 17px;
      height: 9px;
    }

    .gift-bow::before,
    .gift-bow::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 7px;
      border: 2px solid #d4af37;
      border-radius: 50% 50% 45% 45%;
    }

    .gift-bow::before {
      right: 7px;
      transform: rotate(25deg);
    }

    .gift-bow::after {
      left: 7px;
      transform: rotate(-25deg);
    }

    /* عنوان */

    .brand {
      text-align: center;
      position: relative;
    }

    .title {
      font-size: clamp(25px, 7vw, 34px);
      font-weight: 900;
      line-height: 1.6;
      color: #d8b74a;
      text-shadow: 0 2px 18px rgba(212,175,55,0.18);
      letter-spacing: -0.8px;
    }

    .title .vip {
      color: #f0d77a;
      margin-right: 5px;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 400;
      color: #aaa;
      letter-spacing: 1px;
    }

    .gold-line {
      width: 85px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #d4af37,
        transparent
      );
      margin: 14px auto 17px;
    }

    /* باکس اطلاعات */

    .info-box {
      position: relative;
      border: 1px solid rgba(212,175,55,0.42);
      border-radius: 21px;
      padding: 17px 16px;
      margin-bottom: 12px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.008)
        );
      box-shadow:
        inset 0 0 25px rgba(212,175,55,0.025),
        0 8px 20px rgba(0,0,0,0.28);
    }

    .label {
      color: #9e9e9e;
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 7px;
    }

    .value {
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.5;
    }

    .unit {
      font-size: 14px;
      color: #c5c5c5;
      font-weight: 500;
      margin-right: 3px;
    }

    /* پاداش */

    .reward-box {
      position: relative;
      border: 1px solid #d4af37;
      border-radius: 23px;
      padding: 19px 17px 18px;
      margin-top: 14px;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212,175,55,0.12),
          transparent 58%
        ),
        #0d0d0d;
      box-shadow:
        0 0 0 1px rgba(212,175,55,0.07),
        0 12px 32px rgba(0,0,0,0.65),
        inset 0 0 28px rgba(212,175,55,0.045);
    }

    .reward-label {
      color: #bdbdbd;
      font-size: 15px;
      margin-bottom: 7px;
    }

    .reward-value {
      color: #f2d56c;
      font-size: clamp(27px, 7vw, 36px);
      font-weight: 900;
      line-height: 1.5;
      text-shadow:
        0 2px 15px rgba(212,175,55,0.16);
    }

    .reward-description {
      margin-top: 5px;
      color: #888;
      font-size: 12px;
    }

    /* راه های ارتباطی */

    .contact-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 55px;
      margin-top: 15px;
      border-radius: 17px;
      border: 1px solid rgba(212,175,55,0.65);
      background:
        linear-gradient(
          135deg,
          #b88d19,
          #d4af37,
          #9d7611
        );
      color: #080808;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.25);
      transition: 0.2s ease;
    }

    .contact-button:active {
      transform: scale(0.98);
    }

    .contact-icon {
      font-size: 18px;
    }

    /* فوتر */

    .footer {
      text-align: center;
      margin-top: 16px;
      color: #666;
      font-size: 11px;
      line-height: 1.8;
    }

    .footer strong {
      color: #9d8435;
      font-weight: 500;
    }

    /* موبایل */

    @media (max-width: 380px) {
      body {
        padding: 10px 8px 18px;
      }

      .vip-card {
        padding: 18px 14px 16px;
        border-radius: 26px;
      }

      .logo {
        width: 80px;
        height: 80px;
      }

      .title {
        font-size: 24px;
      }

      .info-box {
        padding: 14px;
        border-radius: 18px;
      }

      .value {
        font-size: 22px;
      }

      .reward-value {
        font-size: 28px;
      }

      .contact-button {
        min-height: 51px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="vip-card">

      <div class="gold-glow"></div>

      <!-- لوگو -->
      <div class="logo-box">

        <img
          src="logo.png"
          alt="Veyma Collection"
          class="logo"
        >

        <!-- جعبه هدیه -->
        <div class="gift-decoration" aria-hidden="true">
          <div class="gift-bow"></div>
          <div class="gift-box"></div>
          <div class="gift-ribbon-v"></div>
          <div class="gift-ribbon-h"></div>
        </div>

      </div>


      <!-- عنوان -->
      <div class="brand">

        <h1 class="title">
          کارت هدیه مشتریان
          <span class="vip">VIP</span>
        </h1>

        <div class="subtitle">
          Veyma Collection
        </div>

        <div class="gold-line"></div>

      </div>


      <!-- مجموع خرید -->
      <div class="info-box">

        <div class="label">
          مجموع خرید
        </div>

        <div class="value">
          <span id="totalPurchase">۰</span>
          <span class="unit">تومان</span>
        </div>

      </div>


      <!-- تعداد خرید -->
      <div class="info-box">

        <div class="label">
          تعداد خرید
        </div>

        <div class="value">
          <span id="purchaseCount">۰</span>
          <span class="unit">بار</span>
        </div>

      </div>


      <!-- پاداش فعلی -->
      <div class="reward-box">

        <div class="reward-label">
          پاداش فعلی شما
        </div>

        <div class="reward-value">
          <span id="currentReward">۰</span>
          <span class="unit">تومان</span>
        </div>

        <div class="reward-description">
          پاداش ویژه مشتریان VIP ویما
        </div>

      </div>


      <!-- فقط راه های ارتباطی -->
      <a
        class="contact-button"
        href="https://veymacollection.github.io/veyma-collection/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="contact-icon">✦</span>
        راه‌های ارتباطی
      </a>


      <!-- فوتر -->
      <div class="footer">
        کارت اختصاصی مشتریان ویژه <strong>VEYMA</strong>
      </div>

    </section>

  </main>

</body>
</html>
