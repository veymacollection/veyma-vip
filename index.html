<!-- Firebase -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore
  }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBrNNy3JlP68yoaSANC3usPCDX33JKVBEM",
    authDomain: "veyma-vip.firebaseapp.com",
    projectId: "veyma-vip",
    storageBucket: "veyma-vip.firebasestorage.app",
    messagingSenderId: "553432630474",
    appId: "1:553432630474:web:abab79661d54435dcce033"
  };


  // اتصال به پروژه Veyma VIP
  const app = initializeApp(firebaseConfig);

  // اتصال به Firestore
  const db = getFirestore(app);


  // ==========================================
  // قانون پاداش VIP
  // هر ۵۰ میلیون تومان خرید
  // = ۵۰۰ هزار تومان تخفیف
  // ==========================================

  const PURCHASE_STEP = 50000000;
  const REWARD_STEP = 500000;


  // تبدیل اعداد انگلیسی به فارسی
  function toPersianNumber(number) {
    return number.toLocaleString("fa-IR");
  }


  // محاسبه پاداش بر اساس مجموع خرید
  function calculateReward(totalPurchase) {

    const purchase = Number(totalPurchase) || 0;

    const rewardSteps = Math.floor(
      purchase / PURCHASE_STEP
    );

    return rewardSteps * REWARD_STEP;
  }


  // نمایش پاداش فعلی
  function updateVipReward(totalPurchase) {

    const reward = calculateReward(totalPurchase);

    const rewardElement =
      document.getElementById("currentReward");

    if (!rewardElement) return;

    rewardElement.innerHTML =
      `${toPersianNumber(reward)}
       <span class="unit">تومان</span>`;
  }


  // ------------------------------------------
  // فعلاً مجموع خرید صفر است.
  // وقتی اطلاعات مشتری از Firebase خوانده شود،
  // همین تابع با مجموع خرید واقعی اجرا خواهد شد.
  // ------------------------------------------

  updateVipReward(0);


  console.log(
    "Veyma VIP Firebase connected successfully."
  );

  console.log(
    "VIP Reward Rule: 50,000,000 = 500,000"
  );

</script>
