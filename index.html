<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کارت هدیه مشتریان VIP | Veyma Collection</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 16px 10px 24px;
      font-family: "Vazirmatn", sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212, 175, 55, 0.12),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #050505,
          #11100d 50%,
          #050505
        );
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .vip-card {
      position: relative;
      overflow: hidden;

      padding: 20px 15px 17px;

      border-radius: 29px;
      border: 1px solid rgba(212, 175, 55, 0.62);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.008)
        ),
        #090909;

      box-shadow:
        0 22px 55px rgba(0,0,0,0.75),
        inset 0 0 30px rgba(212,175,55,0.035);
    }

    .vip-card::before {
      content: "";
      position: absolute;
      inset: 6px;

      border-radius: 24px;
      border: 1px solid rgba(212,175,55,0.13);

      pointer-events: none;
    }

    .logo {
      display: block;

      width: 92px;
      height: 92px;

      margin: 0 auto 9px;

      object-fit: contain;

      filter:
        drop-shadow(
          0 5px 17px rgba(212,175,55,0.18)
        );
    }

    .title {
      text-align: center;

      color: #d8b34a;

      font-size: 27px;
      line-height: 1.65;

      font-weight: 900;

      letter-spacing: -0.7px;

      text-shadow:
        0 2px 15px rgba(212,175,55,0.20);
    }

    .vip-word {
      color: #f0d36b;
    }

    .subtitle {
      text-align: center;

      margin-top: 1px;
      margin-bottom: 15px;

      color: #aaa;

      font-size: 14px;
      font-weight: 500;

      direction: ltr;
    }

    .gold-line {
      width: 80px;
      height: 1px;

      margin: 0 auto 15px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #d4af37,
          transparent
        );
    }

    .info-box {
      position: relative;

      min-height: 98px;

      margin-bottom: 11px;
      padding: 15px 18px;

      border-radius: 21px;

      border: 1px solid rgba(212,175,55,0.48);

      background:
        linear-gradient(
          145deg,
          #171717,
          #090909
        );

      box-shadow:
        inset 0 0 18px rgba(212,175,55,0.025),
        0 6px 18px rgba(0,0,0,0.30);
    }

    .label {
      color: #bcbcbc;

      font-size: 15px;
      font-weight: 800;

      margin-bottom: 6px;
    }

    .value {
      color: #fff;

      font-size: 24px;
      font-weight: 800;

      line-height: 1.5;
    }

    .unit {
      color: #c7c7c7;

      font-size: 14px;
      font-weight: 600;
    }

    .reward-wrap {
      position: relative;

      margin-top: 14px;
      margin-bottom: 15px;

      padding: 2px;

      overflow: hidden;

      border-radius: 24px;
    }

    .reward-wrap::before {
      content: "";

      position: absolute;

      width: 190%;
      height: 190%;

      top: -45%;
      left: -45%;

      background:
        conic-gradient(
          transparent 0deg,
          transparent 235deg,
          #9f7a17 270deg,
          #f6df82 300deg,
          #d4af37 320deg,
          transparent 350deg,
          transparent 360deg
        );

      animation:
        rotateGlow 12s linear infinite;
    }

    .reward-wrap::after {
      content: "";

      position: absolute;

      inset: 2px;

      border-radius: 22px;

      background: #0b0b0b;

      z-index: 0;
    }

    @keyframes rotateGlow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .reward-box {
      position: relative;

      z-index: 1;

      min-height: 137px;

      padding: 19px 18px;

      border-radius: 22px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212,175,55,0.13),
          transparent 60%
        ),
        #0b0b0b;

      box-shadow:
        inset 0 0 25px rgba(212,175,55,0.045),
        0 8px 25px rgba(0,0,0,0.60);
    }

    .reward-title {
      color: #d0d0d0;

      font-size: 16px;
      font-weight: 900;

      margin-bottom: 7px;
    }

    .reward-value {
      color: #f1c94e;

      font-size: 30px;
      font-weight: 900;

      line-height: 1.55;

      text-shadow:
        0 0 16px rgba(241,200,78,0.25);
    }

    .contact-button {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      min-height: 53px;

      border-radius: 17px;

      border: 1px solid rgba(212,175,55,0.65);

      background:
        linear-gradient(
          135deg,
          #e0b83f,
          #b78615
        );

      color: #080808;

      text-decoration: none;

      font-size: 17px;
      font-weight: 900;

      box-shadow:
        0 8px 22px rgba(0,0,0,0.40);
    }

    .contact-button:active {
      transform: scale(0.98);
    }

    .footer-text {
      text-align: center;

      margin-top: 13px;

      color: #a4a4a4;

      font-size: 11.5px;
      font-weight: 600;

      line-height: 2;
    }

    @media (max-width: 360px) {

      body {
        padding: 9px 7px 18px;
      }

      .vip-card {
        padding: 17px 11px 15px;
        border-radius: 25px;
      }

      .logo {
        width: 82px;
        height: 82px;
      }

      .title {
        font-size: 23px;
      }

      .info-box {
        min-height: 91px;
        padding: 13px 15px;
      }

      .value {
        font-size: 22px;
      }

      .reward-value {
        font-size: 27px;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <section class="vip-card">

      <img
        class="logo"
        src="logo.webp"
        alt="VEYMA COLLECTION"
      >

      <h1 class="title">
        کارت هدیه مشتریان
        <span class="vip-word">VIP</span>
      </h1>

      <div class="subtitle">
        Veyma Collection
      </div>

      <div class="gold-line"></div>

      <section class="info-box">

        <div class="label">
          مجموع خرید
        </div>

        <div class="value" id="totalPurchase">
          ۰
          <span class="unit">تومان</span>

      </section>

      <section class="info-box">

        <div class="label">

        </div>

        <div class="value" id="purchaseCount">
          ۰
          <span class="unit">بار</span>
        </div>

      </section>

      <div class="reward-wrap">

        <section class="reward-box">

          <div class="reward-title">
            پاداش فعلی شما
          </div>

          <div
            class="reward-value"
            id="currentReward"
          >
            ۰
            <span class="unit">تومان</span>
          </div>

        </section>

      </div>

      <a
        class="contact-button"
        href="https://veymacollection.github.io/veyma-collection/"
        target="_blank"
        rel="noopener noreferrer"
      >
        راه‌های ارتباطی
      </a>

      <div class="footer-text">
        تولید و پخش لباس خانگی زنانه و ست ورزشی ایرانی و خارجی
      </div>

    </section>

  </main>

</body>
</html>
