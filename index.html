<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کارت هدیه مشتریان VIP ویما</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background:
        radial-gradient(circle at top, #242018 0%, #0b0b0b 42%, #050505 100%);
      color: #fff;
      min-height: 100vh;
      padding: 18px 12px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 20px 14px 18px;
      border: 1px solid rgba(212, 168, 55, 0.55);
      border-radius: 28px;
      background: rgba(10, 10, 10, 0.88);
      box-shadow:
        0 0 35px rgba(212, 168, 55, 0.08),
        inset 0 0 25px rgba(212, 168, 55, 0.03);
    }

    /* لوگو */
    .logo {
      display: block;
      width: 105px;
      height: 105px;
      object-fit: contain;
      margin: 0 auto 12px;
      border-radius: 50%;
    }

    /* عنوان */
    .title {
      text-align: center;
      color: #d9ae38;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.7;
      margin-bottom: 4px;
      text-shadow: 0 2px 12px rgba(218, 174, 56, 0.22);
    }

    .subtitle {
      text-align: center;
      color: #ddd;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 20px;
      direction: ltr;
    }

    /* باکس اطلاعات */
    .info-box {
      position: relative;
      margin-bottom: 13px;
      padding: 17px 20px;
      min-height: 105px;
      border: 1px solid rgba(212, 168, 55, 0.65);
      border-radius: 23px;
      background: linear-gradient(
        145deg,
        rgba(25,25,25,0.96),
        rgba(9,9,9,0.98)
      );
      box-shadow:
        inset 0 0 18px rgba(212, 168, 55, 0.035),
        0 5px 18px rgba(0,0,0,0.35);
    }

    .label {
      color: #bcbcbc;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .value {
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.5;
    }

    /* باکس پاداش */
    .reward-wrap {
      position: relative;
      margin-top: 15px;
      margin-bottom: 17px;
      padding: 2px;
      border-radius: 25px;
      overflow: hidden;
    }

    /* نور متحرک دور باکس */
    .reward-wrap::before {
      content: "";
      position: absolute;
      width: 180%;
      height: 180%;
      top: -40%;
      left: -40%;
      background: conic-gradient(
        transparent 0deg,
        transparent 250deg,
        #d7ad35 285deg,
        #fff1a8 310deg,
        #d7ad35 330deg,
        transparent 350deg,
        transparent 360deg
      );
      animation: rotateGlow 4s linear infinite;
    }

    .reward-wrap::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 23px;
      background: #0c0c0c;
      z-index: 0;
    }

    @keyframes rotateGlow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .reward-box {
      position: relative;
      z-index: 1;
      min-height: 145px;
      padding: 21px 20px;
      border-radius: 23px;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212,168,55,0.12),
          transparent 55%
        ),
        #0b0b0b;
      text-align: right;
      box-shadow:
        0 0 25px rgba(212, 168, 55, 0.13),
        inset 0 0 20px rgba(212, 168, 55, 0.05);
    }

    .reward-title {
      color: #d0d0d0;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .reward-value {
      color: #f1c84c;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.6;
      text-shadow:
        0 0 14px rgba(241, 200, 76, 0.22);
    }

    /* راه‌های ارتباطی */
    .contact-button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      color: #080808;
      background: linear-gradient(
        135deg,
        #e5bc45,
        #b98712
      );
      font-size: 17px;
      font-weight: 900;
      box-shadow:
        0 8px 22px rgba(212, 168, 55, 0.18);
      transition: 0.25s ease;
    }

    .contact-button:active {
      transform: scale(0.98);
    }

    /* توضیح پایین */
    .footer-text {
      text-align: center;
      color: #a6a6a6;
      font-size: 12px;
      font-weight: 500;
      line-height: 2;
      margin-top: 14px;
    }

    @media (max-width: 360px) {
      body {
        padding: 10px 8px;
      }

      .page {
        padding: 16px 11px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }

      .title {
        font-size: 23px;
      }

      .value {
        font-size: 22px;
      }

      .reward-value {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- لوگوی ویما -->
    <img
      class="logo"
      src="logo.png"
      alt="VEYMA COLLECTION"
    >

    <!-- عنوان -->
    <h1 class="title">
      کارت هدیه مشتریان VIP
    </h1>

    <div class="subtitle">
      Veyma Collection
    </div>

    <!-- مجموع خرید -->
    <section class="info-box">
      <div class="label">مجموع خرید</div>
      <div class="value" id="totalPurchase">
        ۰ تومان
      </div>
    </section>

    <!-- تعداد خرید -->
    <section class="info-box">
      <div class="label">تعداد خرید</div>
      <div class="value" id="purchaseCount">
        ۰ بار
      </div>
    </section>

    <!-- پاداش فعلی -->
    <div class="reward-wrap">
      <section class="reward-box">

        <div class="reward-title">
          پاداش فعلی شما
        </div>

        <div class="reward-value" id="currentReward">
          ۰ تومان هدیه
        </div>

      </section>
    </div>

    <!-- راه‌های ارتباطی -->
    <a
      class="contact-button"
      href="https://veymacollection.github.io/veyma-collection/"
      target="_blank"
      rel="noopener"
    >
      راه‌های ارتباطی
    </a>

    <!-- متن پایین -->
    <div class="footer-text">
      تولید و پخش لباس خانگی زنانه و ست ورزشی ایرانی و خارجی
    </div>

  </main>

</body>
</html>
