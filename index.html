<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1c" />
  <meta name="description" content="نرم‌افزار مدیریت فروشگاه Veyma Collection" />
  <title>Veyma Collection | مدیریت فروشگاه</title>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            veyma: {
              dark: '#0a0f1c',
              navy: '#111827',
              gold: '#d4af37',
              goldLight: '#f0d78c',
              cream: '#f8f5ef',
              muted: '#9ca3af'
            }
          },
          fontFamily: {
            vazir: ['Vazirmatn', 'Tahoma', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    * { font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body { background: #0a0f1c; color: #f8f5ef; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }

    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sidebar-mobile {
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar-mobile.open { transform: translateX(0); }

    /* دکمه‌های اصلی صفحه */
    .main-btn {
      transition: all 0.25s ease;
      border-radius: 1.25rem;
    }
    .main-btn:active {
      transform: scale(0.97);
    }

    .btn-sale {
      background: linear-gradient(145deg, #dc2626 0%, #b91c1c 100%);
      box-shadow: 0 8px 20px -6px rgba(220, 38, 38, 0.45);
    }
    .btn-sale:hover {
      background: linear-gradient(145deg, #ef4444 0%, #dc2626 100%);
      transform: translateY(-2px);
    }

    .btn-purchase {
      background: linear-gradient(145deg, #16a34a 0%, #15803d 100%);
      box-shadow: 0 8px 20px -6px rgba(22, 163, 74, 0.45);
    }
    .btn-purchase:hover {
      background: linear-gradient(145deg, #22c55e 0%, #16a34a 100%);
      transform: translateY(-2px);
    }

    .btn-scan {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
    }
    .btn-scan:hover {
      border-color: rgba(212, 175, 55, 0.7);
      background: #1e293b;
      transform: translateY(-2px);
    }

    .btn-lowstock {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(239, 68, 68, 0.35);
    }
    .btn-lowstock:hover {
      border-color: rgba(239, 68, 68, 0.6);
      transform: translateY(-2px);
    }

    .nav-item {
      transition: all 0.2s;
      font-size: 15px;
      font-weight: 600;
    }
    .nav-item.active {
      background: rgba(212, 175, 55, 0.14);
      color: #d4af37;
      border-right: 3px solid #d4af37;
    }
    .nav-item:hover:not(.active) {
      background: rgba(255,255,255,0.06);
      color: #f8f5ef;
    }

    .hidden-role { display: none !important; }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #0a0f1c;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-loading {
      opacity: 0.75;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen font-vazir antialiased">

  <!-- لودینگ اولیه -->
  <div id="initial-loading" class="loading-overlay">
    <div class="spinner"></div>
    <p class="text-veyma-gold text-sm tracking-wide">در حال بررسی دسترسی...</p>
  </div>

  <!-- صفحه لاگین -->
  <div id="login-page" class="fixed inset-0 z-50 bg-veyma-dark flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-md bg-veyma-navy border border-veyma-gold/20 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-veyma-gold to-amber-600 flex items-center justify-center mb-4 shadow-lg shadow-veyma-gold/20">
          <span class="text-veyma-dark font-bold text-2xl">V</span>
        </div>
        <h1 class="text-2xl font-bold text-veyma-gold tracking-tight">Veyma Collection</h1>
        <p class="text-veyma-muted text-sm mt-2">ورود به پنل مدیریت فروشگاه</p>
      </div>

      <div class="space-y-5">
        <div>
          <label class="text-sm text-veyma-muted mb-1.5 block">ایمیل</label>
          <input id="login-email" type="email" placeholder="email@example.com"
                 class="w-full bg-white/5 border border-veyma-gold/20 rounded-xl px-4 py-3.5 text-veyma-cream placeholder:text-veyma-muted/60 focus:outline-none focus:border-veyma-gold transition-colors" />
        </div>
        <div>
          <label class="text-sm text-veyma-muted mb-1.5 block">رمز عبور</label>
          <input id="login-password" type="password" placeholder="••••••••"
                 class="w-full bg-white/5 border border-veyma-gold/20 rounded-xl px-4 py-3.5 text-veyma-cream placeholder:text-veyma-muted/60 focus:outline-none focus:border-veyma-gold transition-colors" />
        </div>
        <button id="login-btn" onclick="login()" class="w-full py-3.5 rounded-xl text-base mt-1 flex items-center justify-center gap-2 font-bold"
                style="background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%); color: #0a0f1c;">
          <span id="login-btn-text">ورود به پنل</span>
          <div id="login-spinner" class="spinner hidden" style="width:18px;height:18px;border-width:2px;"></div>
        </button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
      </div>
    </div>
  </div>

  <!-- Overlay موبایل -->
  <div id="overlay" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden" onclick="closeSidebar()"></div>

  <!-- سایدبار -->
  <aside id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-veyma-navy border-l border-veyma-gold/20 z-50 sidebar-mobile lg:translate-x-0 flex flex-col shadow-2xl">
    
    <div class="flex items-center justify-between p-5 border-b border-veyma-gold/15">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-veyma-gold to-amber-600 flex items-center justify-center shadow-md shadow-veyma-gold/20">
          <span class="text-veyma-dark font-bold text-lg">V</span>
        </div>
        <div>
          <h1 class="text-veyma-gold font-bold text-lg leading-tight">Veyma</h1>
          <p class="text-xs text-veyma-muted tracking-wide">Collection</p>
        </div>
      </div>
      <button onclick="closeSidebar()" class="lg:hidden w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center text-veyma-gold hover:bg-white/10 transition-colors">
        ✕
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto py-5 px-3 space-y-1.5">
      <a href="#" onclick="goTo('dashboard'); return false;" data-roles="admin,partner,seller" class="nav-item active flex items-center gap-3 px-4 py-3.5 rounded-xl">
        داشبورد
      </a>
      <a href="#" onclick="goTo('sale'); return false;" data-roles="admin,partner,seller" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-xl text-veyma-muted">
        فروش
      </a>
      <a href="#" onclick="goTo('purchase'); return false;" data-roles="admin,partner" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-xl text-veyma-muted">
        خرید
      </a>
      <a href="#" onclick="goTo('accounts'); return false;" data-roles="admin,partner" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-xl text-veyma-muted">
        حساب
      </a>
      <a href="#" onclick="goTo('activities'); return false;" data-roles="admin,partner" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-xl text-veyma-muted">
        فعالیت
      </a>
      <a href="#" onclick="goTo('users'); return false;" data-roles="admin" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-xl text-veyma-muted">
        مدیریت کاربران
      </a>
      <a href="#" onclick="goTo('settings'); return false;" data-roles="admin" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-xl text-veyma-muted">
        تنظیمات
      </a>
    </nav>

    <div class="p-4 border-t border-veyma-gold/15">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-veyma-gold/20 flex items-center justify-center text-veyma-gold font-bold" id="user-avatar">م</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate text-veyma-cream" id="user-name">—</p>
          <p class="text-xs text-veyma-muted" id="user-role-label">—</p>
        </div>
        <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 px-2.5 py-1.5 rounded-lg hover:bg-white/5 transition-colors font-medium">خروج</button>
      </div>
    </div>
  </aside>

  <!-- محتوای اصلی -->
  <div id="app" class="lg:mr-72 min-h-screen flex flex-col hidden">

    <header class="sticky top-0 z-30 bg-veyma-dark/90 backdrop-blur-md border-b border-veyma-gold/10 px-4 py-3.5">
      <div class="flex items-center justify-between gap-3">
        <button onclick="openSidebar()" class="lg:hidden w-11 h-11 rounded-xl bg-white/5 flex items-center justify-center text-veyma-gold hover:bg-white/10 transition-colors">
          ☰
        </button>
        <div class="flex-1">
          <h2 class="text-xl font-bold text-veyma-cream tracking-tight" id="page-title">داشبورد</h2>
          <p class="text-xs text-veyma-muted mt-0.5" id="current-date">—</p>
        </div>
      </div>
    </header>

    <main class="flex-1 p-4 md:p-6 fade-in" id="main-content">

      <!-- چهار دکمه اصلی -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto mt-4">

        <!-- فروش (قرمز) -->
        <button onclick="goTo('sale')" data-roles="admin,partner,seller"
                class="main-btn btn-sale flex flex-col items-center justify-center gap-3 py-8 px-5 text-white">
          <span class="text-3xl font-bold">＋</span>
          <span class="text-xl font-bold tracking-wide">فروش</span>
        </button>

        <!-- خرید (سبز) -->
        <button onclick="goTo('purchase')" data-roles="admin,partner"
                class="main-btn btn-purchase flex flex-col items-center justify-center gap-3 py-8 px-5 text-white">
          <span class="text-3xl">🛒</span>
          <span class="text-xl font-bold tracking-wide">خرید</span>
        </button>

        <!-- اسکن فاکتور -->
        <button onclick="goTo('scan')" data-roles="admin,partner,seller"
                class="main-btn btn-scan flex flex-col items-center justify-center gap-3 py-8 px-5 text-veyma-gold">
          <span class="text-3xl">📷</span>
          <span class="text-xl font-bold tracking-wide">اسکن فاکتور</span>
        </button>

        <!-- موجودی رو به اتمام -->
        <button onclick="goTo('inventory')" data-roles="admin,partner,seller"
                class="main-btn btn-lowstock flex items-center justify-center gap-4 py-8 px-5">
          <div class="w-12 h-12 rounded-full bg-red-500/15 flex items-center justify-center">
            <span class="text-red-500 text-2xl">⚠</span>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold text-veyma-cream leading-tight">موجودی رو به اتمام</p>
            <p class="text-sm text-veyma-muted mt-1" id="stat-low-stock">۰ قلم</p>
          </div>
        </button>

      </div>

    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrNNy3JlP68yoaSANC3usPCDX33JKVBEM",
      authDomain: "veyma-vip.firebaseapp.com",
      projectId: "veyma-vip",
      storageBucket: "veyma-vip.firebasestorage.app",
      messagingSenderId: "553432630474",
      appId: "1:553432630474:web:abab79661d54435dcce033"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentRole = null;

    auth.onAuthStateChanged(async (user) => {
      const initialLoading = document.getElementById('initial-loading');
      if (initialLoading) initialLoading.style.display = 'none';

      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();

          if (!userDoc.exists) {
            await auth.signOut();
            showLoginError('حساب شما هنوز توسط مدیر تأیید نشده است');
            document.getElementById('login-page').classList.remove('hidden');
            return;
          }

          const data = userDoc.data();

          if (data.status !== 'active') {
            await auth.signOut();
            showLoginError('دسترسی شما توسط مدیر غیرفعال شده است');
            document.getElementById('login-page').classList.remove('hidden');
            return;
          }

          currentUser = { uid: user.uid, email: user.email, ...data };
          currentRole = data.role;

          document.getElementById('login-page').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');

          document.getElementById('user-name').textContent = data.name || 'کاربر';
          document.getElementById('user-role-label').textContent = roleToPersian(currentRole);
          document.getElementById('user-avatar').textContent = (data.name || 'ک').charAt(0);

          applyRolePermissions();
          loadDashboard();

        } catch (error) {
          console.error(error);
          await auth.signOut();
          showLoginError('خطا در بررسی دسترسی');
          document.getElementById('login-page').classList.remove('hidden');
        }
      } else {
        closeSidebar();
        document.getElementById('login-page').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
        currentUser = null;
        currentRole = null;

        const btn = document.getElementById('login-btn');
        const btnText = document.getElementById('login-btn-text');
        const spinner = document.getElementById('login-spinner');
        if (btn) {
          btn.classList.remove('btn-loading');
          btnText.textContent = 'ورود به پنل';
          spinner.classList.add('hidden');
        }
      }
    });

    function roleToPersian(role) {
      const map = { admin: 'مدیر', partner: 'شریک', seller: 'فروشنده' };
      return map[role] || role;
    }

    function applyRolePermissions() {
      document.querySelectorAll('[data-roles]').forEach(el => {
        const allowedRoles = el.getAttribute('data-roles').split(',');
        if (allowedRoles.includes(currentRole)) {
          el.classList.remove('hidden-role');
        } else {
          el.classList.add('hidden-role');
        }
      });
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-spinner');

      if (!email || !password) {
        showLoginError('ایمیل و رمز عبور را وارد کنید');
        return;
      }

      btn.classList.add('btn-loading');
      btnText.textContent = 'در حال ورود...';
      spinner.classList.remove('hidden');
      errorEl.classList.add('hidden');

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        showLoginError('ایمیل یا رمز عبور اشتباه است');
        btn.classList.remove('btn-loading');
        btnText.textContent = 'ورود به پنل';
        spinner.classList.add('hidden');
      }
    }

    function showLoginError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function logout() {
      closeSidebar();
      auth.signOut();
    }

    async function loadDashboard() {
      try {
        const el = document.getElementById('stat-low-stock');
        if (el) el.textContent = '۰ قلم';
      } catch (err) {
        console.error(err);
      }
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function goTo(page) {
      closeSidebar();

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        item.classList.add('text-veyma-muted');
      });
      const activeLink = document.querySelector(`.nav-item[onclick*="'${page}'"]`);
      if (activeLink) {
        activeLink.classList.add('active');
        activeLink.classList.remove('text-veyma-muted');
      }

      const titles = {
        dashboard: 'داشبورد',
        sale: 'فروش',
        purchase: 'خرید',
        scan: 'اسکن فاکتور',
        accounts: 'حساب',
        activities: 'فعالیت',
        users: 'مدیریت کاربران',
        settings: 'تنظیمات',
        inventory: 'موجودی رو به اتمام'
      };

      document.getElementById('page-title').textContent = titles[page] || page;
      showToast('رفتن به: ' + (titles[page] || page));
    }

    function showToast(message) {
      const old = document.getElementById('veyma-toast');
      if (old) old.remove();

      const toast = document.createElement('div');
      toast.id = 'veyma-toast';
      toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-veyma-navy border border-veyma-gold/40 text-veyma-cream px-6 py-3 rounded-2xl shadow-lg z-50 text-sm font-medium';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    document.getElementById('current-date').textContent =
      new Date().toLocaleDateString('fa-IR', {
        weekday: 'long',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }) + ' — ' + new Date().toLocaleTimeString('fa-IR', {
        hour: '2-digit',
        minute: '2-digit'
      });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSidebar();
    });
  </script>
</body>
</html>
