<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1c" />
  <title>فروش | Veyma Collection</title>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            veyma: {
              dark: '#0a0f1c',
              navy: '#111827',
              gold: '#d4af37',
              goldLight: '#f0d78c',
              cream: '#f8f5ef',
              muted: '#9ca3af'
            }
          },
          fontFamily: {
            vazir: ['Vazirmatn', 'Tahoma', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    * { font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body { background: #0a0f1c; color: #f8f5ef; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }

    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: linear-gradient(160deg, #121a2b 0%, #0d1424 100%);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      transition: all 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #d4af37;
      background: rgba(255,255,255,0.08);
    }

    .btn-primary {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      transform: translateY(-1px);
    }

    .btn-send {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transition: all 0.2s;
    }
    .btn-send:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-1px);
    }

    .medal-gold { color: #fbbf24; }
    .medal-silver { color: #94a3b8; }
    .medal-bronze { color: #d97706; }
    .medal-normal { color: #6b7280; }

    .profit { color: #22c55e; }
    .hidden-role { display: none !important; }
  </style>
</head>
<body class="min-h-screen font-vazir antialiased flex flex-col">

  <!-- هدر با لوگو و متن تشکر -->
  <header class="sticky top-0 z-30 bg-veyma-dark/95 backdrop-blur-md border-b border-veyma-gold/10 px-4 py-3">
    <div class="flex items-center justify-between gap-3 max-w-2xl mx-auto">
      <!-- دکمه بازگشت -->
      <a href="index.html" class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-veyma-gold hover:bg-white/10 transition-colors text-lg shrink-0">
        →
      </a>

      <!-- متن وسط -->
      <div class="flex-1 text-center">
        <p class="text-veyma-gold font-bold text-sm md:text-base">ممنون از خرید شما</p>
        <p class="text-[11px] text-veyma-muted mt-0.5" id="current-date">—</p>
      </div>

      <!-- لوگو -->
      <img src="logo.webp" alt="Veyma" class="w-11 h-11 rounded-xl object-cover shrink-0 border border-veyma-gold/30" 
           onerror="this.style.display='none'" />
    </div>
  </header>

  <main class="flex-1 p-4 md:p-6 space-y-6 fade-in max-w-2xl mx-auto w-full">

    <!-- فرم ثبت فروش -->
    <section class="card rounded-2xl p-5">
      <h2 class="text-base font-bold text-veyma-gold mb-4 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        ثبت فروش
      </h2>

      <div class="space-y-4">
        <div>
          <label class="text-sm text-veyma-muted mb-1.5 block">نام مشتری</label>
          <input id="customer-name" type="text" placeholder="نام مشتری را وارد کنید"
                 class="input-field w-full rounded-xl px-4 py-3 text-veyma-cream" list="customers-list" />
          <datalist id="customers-list"></datalist>
        </div>

        <div>
          <label class="text-sm text-veyma-muted mb-1.5 block">شماره تلفن</label>
          <input id="customer-phone" type="tel" placeholder="09xxxxxxxxx"
                 class="input-field w-full rounded-xl px-4 py-3 text-veyma-cream" />
        </div>

        <div>
          <label class="text-sm text-veyma-muted mb-1.5 block">انتخاب کالا از انبار</label>
          <select id="product-select" class="input-field w-full rounded-xl px-4 py-3 text-veyma-cream">
            <option value="">— انتخاب کالا —</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-veyma-muted mb-1.5 block">تعداد (عدد)</label>
            <input id="qty-number" type="number" min="0" placeholder="0"
                   class="input-field w-full rounded-xl px-4 py-3 text-veyma-cream" />
          </div>
          <div>
            <label class="text-sm text-veyma-muted mb-1.5 block">تعداد جین</label>
            <input id="qty-jean" type="number" min="0" step="0.5" placeholder="0"
                   class="input-field w-full rounded-xl px-4 py-3 text-veyma-cream" />
          </div>
        </div>

        <!-- بخش سود (فقط مدیر و شریک) -->
        <div id="price-info" class="bg-white/5 rounded-xl p-4 space-y-2 hidden-role" data-roles="admin,partner">
          <div class="flex justify-between text-sm">
            <span class="text-veyma-muted">قیمت خرید واحد:</span>
            <span id="cost-price" class="text-veyma-cream">۰ تومان</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-veyma-muted">قیمت فروش واحد:</span>
            <span id="sale-price" class="text-veyma-cream">۰ تومان</span>
          </div>
          <div class="flex justify-between text-sm font-bold border-t border-white/10 pt-2 mt-2">
            <span class="text-veyma-muted">سود این فروش:</span>
            <span id="profit-value" class="profit">۰ تومان</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-2">
          <button onclick="submitSale(false)" class="btn-primary py-3.5 rounded-xl text-white font-bold text-base">
            ثبت فروش
          </button>
          <button onclick="submitSale(true)" class="btn-send py-3.5 rounded-xl text-white font-bold text-base">
            ثبت و ارسال
          </button>
        </div>
      </div>
    </section>

    <!-- لیست مشتریان -->
    <section>
      <h2 class="text-base font-bold text-veyma-gold mb-3 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-veyma-gold"></span>
        مشتریان
      </h2>
      <div id="customers-container" class="space-y-3">
        <p class="text-center text-veyma-muted text-sm py-8">در حال بارگذاری مشتریان...</p>
      </div>
    </section>

  </main>

  <!-- فوتر اطلاعات تماس و حساب -->
  <footer class="mt-auto border-t border-veyma-gold/15 bg-veyma-navy/80 px-4 py-5">
    <div class="max-w-2xl mx-auto text-center space-y-2">
      <p class="text-veyma-gold font-bold text-sm">Veyma Collection</p>
      
      <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-xs text-veyma-muted">
        <span>📞 ۰۹۱۲۸۶۰۶۰۷۶</span>
        <span>📞 ۰۹۱۲۵۴۹۰۵۰۳</span>
      </div>

      <div class="text-xs text-veyma-muted space-y-1 pt-1">
        <p>کارت: <span class="text-veyma-cream tracking-wider">۵۰۲۲-۲۹۱۵-۸۸۵۶-۲۱۹۷</span></p>
        <p>شبا: <span class="text-veyma-cream tracking-wider">IR۵۷-۰۵۷۰-۰۷۷۷-۰۰۰۱-۰۵۳۵-۴۹۰۰-۰۱</span></p>
        <p class="text-veyma-gold/80">به نام: وحید عباسی</p>
      </div>
    </div>
  </footer>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-veyma-navy border border-veyma-gold/40 text-veyma-cream px-6 py-3 rounded-2xl shadow-lg z-50 text-sm font-medium hidden"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrNNy3JlP68yoaSANC3usPCDX33JKVBEM",
      authDomain: "veyma-vip.firebaseapp.com",
      projectId: "veyma-vip",
      storageBucket: "veyma-vip.firebasestorage.app",
      messagingSenderId: "553432630474",
      appId: "1:553432630474:web:abab79661d54435dcce033"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let products = [];
    let selectedProduct = null;
    let currentRole = null;

    document.getElementById('current-date').textContent =
      new Date().toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' }) +
      ' — ' + new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          currentRole = userDoc.data().role;
          applyRolePermissions();
        }
      } catch (e) {
        console.error(e);
      }

      loadProducts();
      loadCustomers();
    });

    function applyRolePermissions() {
      document.querySelectorAll('[data-roles]').forEach(el => {
        const allowed = el.getAttribute('data-roles').split(',');
        if (allowed.includes(currentRole)) {
          el.classList.remove('hidden-role');
        } else {
          el.classList.add('hidden-role');
        }
      });
    }

    async function loadProducts() {
      try {
        const snap = await db.collection('products').where('status', '!=', 'deleted').get();
        products = [];
        const select = document.getElementById('product-select');
        select.innerHTML = '<option value="">— انتخاب کالا —</option>';

        if (snap.empty) {
          const opt = document.createElement('option');
          opt.disabled = true;
          opt.textContent = 'هنوز کالایی در انبار ثبت نشده';
          select.appendChild(opt);
          return;
        }

        snap.forEach(doc => {
          const p = { id: doc.id, ...doc.data() };
          products.push(p);
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.name} (موجودی: ${p.stock || 0})`;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
        showToast('خطا در بارگذاری کالاها');
      }
    }

    document.getElementById('product-select').addEventListener('change', function () {
      const id = this.value;
      selectedProduct = products.find(p => p.id === id) || null;

      if (selectedProduct) {
        document.getElementById('cost-price').textContent = (selectedProduct.costPrice || 0).toLocaleString('fa-IR') + ' تومان';
        document.getElementById('sale-price').textContent = (selectedProduct.salePrice || 0).toLocaleString('fa-IR') + ' تومان';
        calculateProfit();
      } else {
        document.getElementById('cost-price').textContent = '۰ تومان';
        document.getElementById('sale-price').textContent = '۰ تومان';
        document.getElementById('profit-value').textContent = '۰ تومان';
      }
    });

    document.getElementById('qty-number').addEventListener('input', calculateProfit);
    document.getElementById('qty-jean').addEventListener('input', calculateProfit);

    function calculateProfit() {
      if (!selectedProduct) {
        document.getElementById('profit-value').textContent = '۰ تومان';
        return;
      }

      const qtyNumber = parseFloat(document.getElementById('qty-number').value) || 0;
      const qtyJean = parseFloat(document.getElementById('qty-jean').value) || 0;
      const totalQty = qtyNumber + (qtyJean * 12);

      const cost = selectedProduct.costPrice || 0;
      const sale = selectedProduct.salePrice || 0;
      const profit = (sale - cost) * totalQty;

      document.getElementById('profit-value').textContent = profit.toLocaleString('fa-IR') + ' تومان';
    }

    async function submitSale(isSend = false) {
      const name = document.getElementById('customer-name').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();
      const productId = document.getElementById('product-select').value;
      const qtyNumber = parseFloat(document.getElementById('qty-number').value) || 0;
      const qtyJean = parseFloat(document.getElementById('qty-jean').value) || 0;
      const totalQty = qtyNumber + (qtyJean * 12);

      if (!name) return showToast('نام مشتری را وارد کنید');
      if (!productId) return showToast('کالا را انتخاب کنید');
      if (totalQty <= 0) return showToast('تعداد را مشخص کنید');

      const product = products.find(p => p.id === productId);
      if (!product) return showToast('کالا یافت نشد');

      if ((product.stock || 0) < totalQty) {
        return showToast('موجودی کافی نیست!');
      }

      try {
        const cost = product.costPrice || 0;
        const salePrice = product.salePrice || 0;
        const profit = (salePrice - cost) * totalQty;
        const totalAmount = salePrice * totalQty;

        await db.collection('sales').add({
          customerName: name,
          customerPhone: phone,
          productId: productId,
          productName: product.name,
          qtyNumber,
          qtyJean,
          totalQty,
          costPrice: cost,
          salePrice,
          totalAmount,
          profit,
          status: isSend ? 'sent' : 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: auth.currentUser.uid
        });

        await db.collection('products').doc(productId).update({
          stock: firebase.firestore.FieldValue.increment(-totalQty)
        });

        await upsertCustomer(name, phone, totalAmount, product.name);

        showToast(isSend ? 'فروش ثبت و ارسال شد' : 'فروش با موفقیت ثبت شد');
        
        document.getElementById('customer-name').value = '';
        document.getElementById('customer-phone').value = '';
        document.getElementById('product-select').value = '';
        document.getElementById('qty-number').value = '';
        document.getElementById('qty-jean').value = '';
        document.getElementById('cost-price').textContent = '۰ تومان';
        document.getElementById('sale-price').textContent = '۰ تومان';
        document.getElementById('profit-value').textContent = '۰ تومان';
        selectedProduct = null;

        loadProducts();
        loadCustomers();

      } catch (e) {
        console.error(e);
        showToast('خطا در ثبت فروش');
      }
    }

    async function upsertCustomer(name, phone, amount, productName) {
      try {
        let snap;
        if (phone) {
          snap = await db.collection('customers').where('phone', '==', phone).limit(1).get();
        } else {
          snap = await db.collection('customers').where('name', '==', name).limit(1).get();
        }

        if (snap.empty) {
          await db.collection('customers').add({
            name,
            phone: phone || '',
            totalSpent: amount,
            purchaseCount: 1,
            lastPurchase: firebase.firestore.FieldValue.serverTimestamp(),
            mostBought: { [productName]: 1 },
            status: 'active'
          });
        } else {
          const doc = snap.docs[0];
          const data = doc.data();
          const mostBought = data.mostBought || {};
          mostBought[productName] = (mostBought[productName] || 0) + 1;

          await doc.ref.update({
            name,
            totalSpent: (data.totalSpent || 0) + amount,
            purchaseCount: (data.purchaseCount || 0) + 1,
            lastPurchase: firebase.firestore.FieldValue.serverTimestamp(),
            mostBought
          });
        }
      } catch (e) {
        console.error('خطا در به‌روزرسانی مشتری:', e);
      }
    }

    async function loadCustomers() {
      const container = document.getElementById('customers-container');
      const datalist = document.getElementById('customers-list');
      datalist.innerHTML = '';

      try {
        let snap;
        try {
          snap = await db.collection('customers')
            .where('status', '==', 'active')
            .orderBy('totalSpent', 'desc')
            .limit(50)
            .get();
        } catch (e) {
          snap = await db.collection('customers')
            .where('status', '==', 'active')
            .limit(50)
            .get();
        }

        if (snap.empty) {
          container.innerHTML = `
            <div class="text-center py-10">
              <p class="text-veyma-muted text-sm">هنوز مشتری ثبت نشده</p>
              <p class="text-veyma-muted/60 text-xs mt-1">اولین فروش را ثبت کنید تا مشتری اینجا ظاهر شود</p>
            </div>
          `;
          return;
        }

        let html = '';
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => (b.totalSpent || 0) - (a.totalSpent || 0));

        list.forEach(c => {
          const medal = getMedal(c.totalSpent || 0, c.purchaseCount || 0);
          const lastDate = c.lastPurchase ? c.lastPurchase.toDate().toLocaleString('fa-IR') : '—';
          const most = getMostBought(c.mostBought);

          const opt = document.createElement('option');
          opt.value = c.name;
          datalist.appendChild(opt);

          html += `
            <div class="card rounded-2xl p-4">
              <div class="flex items-start justify-between gap-3">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-xl">${medal.icon}</span>
                    <h3 class="font-bold text-veyma-cream">${c.name}</h3>
                    <span class="text-xs \( {medal.color}"> \){medal.label}</span>
                  </div>
                  <p class="text-sm text-veyma-muted">${c.phone || '—'}</p>
                  <p class="text-xs text-veyma-muted mt-1">آخرین خرید: ${lastDate}</p>
                  <p class="text-xs text-veyma-muted mt-0.5">بیشترین خرید: ${most}</p>
                </div>
                <div class="text-left">
                  <p class="text-sm font-bold text-veyma-gold">${(c.totalSpent || 0).toLocaleString('fa-IR')}</p>
                  <p class="text-[11px] text-veyma-muted">تومان</p>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (e) {
        console.error(e);
        container.innerHTML = `
          <div class="text-center py-10">
            <p class="text-veyma-muted text-sm">هنوز مشتری ثبت نشده</p>
            <p class="text-veyma-muted/60 text-xs mt-1">اولین فروش را ثبت کنید تا مشتری اینجا ظاهر شود</p>
          </div>
        `;
      }
    }

    function getMedal(totalSpent, count) {
      if (totalSpent >= 50000000 || count >= 20) return { icon: '🥇', label: 'طلایی', color: 'medal-gold' };
      if (totalSpent >= 20000000 || count >= 10) return { icon: '🥈', label: 'نقره‌ای', color: 'medal-silver' };
      if (totalSpent >= 5000000 || count >= 5) return { icon: '🥉', label: 'برنزی', color: 'medal-bronze' };
      return { icon: '⚪', label: 'معمولی', color: 'medal-normal' };
    }

    function getMostBought(mostBought) {
      if (!mostBought || Object.keys(mostBought).length === 0) return '—';
      const sorted = Object.entries(mostBought).sort((a, b) => b[1] - a[1]);
      return sorted[0][0];
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }
  </script>
</body>
</html>
